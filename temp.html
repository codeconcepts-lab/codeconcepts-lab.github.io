<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Lightbox Gallery</title>
    <link rel="stylesheet" href="assets/css/gallery.css">
    <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

    <h1>Image Gallery</h1>

    <div class="gallery-grid">
        <a href="images/full/image1.jpg" class="gallery-item">
            <img src="images/thumbs/image1_thumb.jpg" alt="Description of image 1">
        </a>
        <a href="images/full/image2.jpg" class="gallery-item">
            <img src="images/thumbs/image2_thumb.jpg" alt="Description of image 2">
        </a>
        <a href="images/full/image3.jpg" class="gallery-item">
            <img src="images/thumbs/image3_thumb.jpg" alt="Description of image 3">
        </a>
        <a href="images/full/image4.jpg" class="gallery-item">
            <img src="images/thumbs/image4_thumb.jpg" alt="Description of image 4">
        </a>
         <a href="images/full/image5.jpg" class="gallery-item">
            <img src="images/thumbs/image5_thumb.jpg" alt="Description of image 5">
        </a>
        <a href="images/full/image6.jpg" class="gallery-item">
            <img src="images/thumbs/image6_thumb.jpg" alt="Description of image 6">
        </a>
        <a href="images/full/image7.jpg" class="gallery-item">
            <img src="images/thumbs/image7_thumb.jpg" alt="Description of image 7">
        </a>
        <a href="images/full/image8.jpg" class="gallery-item">
            <img src="images/thumbs/image8_thumb.jpg" alt="Description of image 8">
        </a>
        </div>

    <div id="lightbox-modal" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-image">
        <a class="lightbox-prev">&#10094;</a>
        <a class="lightbox-next">&#10095;</a>
        <div id="lightbox-caption"></div>
    </div>

    <script src="assets/js/gallery.js"></script>
</body>
</html>
